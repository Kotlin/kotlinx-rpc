name: Verify Readme

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-readme:
    name: Run Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the readme changes only from a release branch
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" != "main" || "$PR_BRANCH" =~ ^release/ ]]; then
            exit 0
          fi
          changed_readme=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- README.md)
          if [[ -n "$changed_readme" ]]; then
            echo "The PR changes README.md. A PR to main can change README.md only from a release/* branch."
            exit 1
          fi
