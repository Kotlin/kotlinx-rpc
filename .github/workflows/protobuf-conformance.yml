name: Verify Protobuf Conformance is Up-to-Date

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-platforms-table:
    name: Run Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Protobuf Conformance Test Generation
        run: ./gradlew :tests:protobuf-conformance:protobufGenerateCommonMain --info --stacktrace
      - name: Check if protobuf-conformance test is up-to-date
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain | grep tests/protobuf-conformance/)" ]]; then
            echo "The generated protobuf conformance sources are out of date."
            echo "Run './gradlew :tests:protobuf-conformance:protobufGenerateCommonMain' and commit the changes."
            git status --porcelain
            git diff --minimal | cat
            exit 1
          fi
